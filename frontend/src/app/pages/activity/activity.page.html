@if (activity$ | async; as activity) {
  <header class="border-bottom bg-body-tertiary flex-grow-0 flex-shrink-0">
    <div class="container py-4">
      <a class="d-inline-block mb-2" routerLink="/activities">← All activities</a>
      <h1 class="mb-1">{{ activity.name }}</h1>
      <time class="text-body-secondary" [attr.datetime]="activity.date">
        {{ activity.date | date: 'mediumDate' }}
      </time>
    </div>
  </header>

  <main class="container pb-4 d-flex flex-column flex-fill min-h-0 overflow-hidden">
    <section
      class="analysis-section d-flex flex-column flex-fill min-h-0"
      aria-label="Activity analysis"
    >
      <div
        class="nav nav-tabs flex-grow-0 flex-shrink-0"
        role="tablist"
        aria-label="Analysis views"
      >
        <button
          id="details-tab"
          type="button"
          class="nav-link"
          role="tab"
          aria-controls="details-panel"
          [class.active]="selectedAnalysisTab() === 'details'"
          [attr.aria-selected]="selectedAnalysisTab() === 'details'"
          (click)="selectAnalysisTab('details')"
        >
          Details
        </button>
        <button
          id="laps-tab"
          type="button"
          class="nav-link"
          role="tab"
          aria-controls="laps-panel"
          [class.active]="selectedAnalysisTab() === 'laps'"
          [attr.aria-selected]="selectedAnalysisTab() === 'laps'"
          (click)="selectAnalysisTab('laps')"
        >
          Laps
        </button>
      </div>

      @if (selectedAnalysisTab() === 'details') {
        <div
          id="details-panel"
          class="d-flex flex-fill flex-column min-h-0 pt-3"
          role="tabpanel"
          aria-labelledby="details-tab"
          tabindex="0"
        >
          <app-details class="w-100 h-100" [activity]="activity" />
        </div>
      } @else if (selectedAnalysisTab() === 'laps') {
        <div
          id="laps-panel"
          class="d-flex flex-fill flex-column min-h-0 pt-3"
          role="tabpanel"
          aria-labelledby="laps-tab"
          tabindex="0"
        >
          <app-laps class="w-100 h-100" [laps]="laps$ | async" />
        </div>
      }
    </section>
  </main>
} @else {
  <main class="container py-4">
    <p class="text-body-secondary" role="status">Loading activity…</p>
  </main>
}
